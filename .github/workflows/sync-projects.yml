name: Sync GitHub projects

# Pulls repos + READMEs from GitHub and commits src/data/githubProjects.json
# when it changes. The commit on main triggers the usual Vercel/Netlify redeploy.

on:
  schedule:
    # 06:00 UTC every Monday and Thursday.
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {} # allow running it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch projects from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:projects

      - name: Commit changes if any
        run: |
          if git diff --quiet -- src/data/githubProjects.json; then
            echo "No project changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/githubProjects.json
          git commit -m "chore: sync GitHub projects"
          git push
